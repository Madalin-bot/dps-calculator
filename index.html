<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPS Calculator</title>
  <style>
:root {
  --bg-color: #121212;
  --text-color: #ffffff;
  --card-bg: #1e1e1e;
  --input-bg: #2a2a2a;
  --button-bg: #00ffcc;
  --button-hover: #00d6b8;
  --result-color: #00ffcc;
  --border-radius: 12px;
  --transition-speed: 0.3s;
}

body.light-mode {
  --bg-color: #f4f4f4;
  --text-color: #222;
  --card-bg: #ffffff;
  --input-bg: #f0f0f0;
  --button-bg: #007acc;
  --button-hover: #005ea3;
  --result-color: #007acc;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color var(--transition-speed), color var(--transition-speed);
}

.container {
  display: flex;
  justify-content: center;
  padding: 3rem 1rem;
}

.card {
  background-color: var(--card-bg);
  padding: 2rem 2.5rem;
  border-radius: var(--border-radius);
  width: 100%;
  max-width: 600px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.2rem 2rem;
}

.card h1 {
  grid-column: 1 / -1;
  text-align: center;
  margin-bottom: 1.5rem;
  font-size: 2rem;
}

label {
  font-size: 0.9rem;
  margin-bottom: 0.3rem;
  display: block;
  color: var(--text-color);
}

input[type="number"], select {
  width: 100%;
  padding: 0.7rem;
  border-radius: var(--border-radius);
  border: none;
  background-color: var(--input-bg);
  color: var(--text-color);
  font-size: 1rem;
  transition: background-color 0.3s;
}

input[type="number"]::placeholder {
  color: #888;
}

input[type="number"]:focus, select:focus {
  outline: 2px solid var(--button-bg);
}

.section {
  grid-column: 1 / -1;
  background-color: rgba(255,255,255,0.05);
  padding: 1rem;
  border-radius: var(--border-radius);
  margin-bottom: 1rem;
}

.section h2 {
  margin: 0 0 0.5rem 0;
  font-size: 1.1rem;
  color: var(--button-bg);
}

.button-container {
  grid-column: 1 / -1;
}

button {
  width: 100%;
  padding: 1rem;
  font-size: 1.1rem;
  border: none;
  border-radius: var(--border-radius);
  background-color: var(--button-bg);
  color: var(--text-color);
  cursor: pointer;
  transition: background-color 0.3s, transform 0.1s;
}

button:hover {
  background-color: var(--button-hover);
}

button:active {
  transform: scale(0.97);
}

.result {
  grid-column: 1 / -1;
  font-size: 1.2rem;
  color: var(--result-color);
  text-align: center;
  margin-top: 1rem;
  word-wrap: break-word;
}

.toggle-mode {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 0.9rem;
  padding: 0.5rem 1rem;
  background-color: var(--button-bg);
  border-radius: 20px;
  border: none;
  color: var(--text-color);
  cursor: pointer;
  z-index: 99;
}

@media screen and (max-width: 700px) {
  .card {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<p id="info-message">This doesn't work with perfect spa DoT units yet, like Benimaru/Itachi/Sasuke!</p>
<canvas id="background"></canvas>
<button class="toggle-mode" onclick="toggleMode()">Toggle Mode</button>

<div class="container">
  <div class="card">
    <h1>DPS Calculator</h1>
    <div class="input-group">
      <input type="number" id="damage" placeholder="Enter Damage" />
      <select id="damageUnit">
        <option value="1">-</option>
        <option value="1000000">Million</option>
        <option value="1000000000">Billion</option>
        <option value="1000000000000">Trillion</option>
      </select>
    </div>
    <input type="number" id="spa" placeholder="Enter SPA (Seconds Per Attack)" />
    <input type="number" id="critDmg" placeholder="Crit Damage % (e.g. 50 for 50%)" />
    <input type="number" id="critChance" placeholder="Crit Chance % (e.g. 30 for 30%)" />

    <!-- DOT select + custom multiplier inputs -->
    <div class="input-group">
      <select id="statusEffect">
        <option value="none">None</option>
        <option value="bolt">Bolt</option>
        <option value="bleed">Bleed</option>
        <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffectMultiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>

    <!-- Repeat for statusEffect1..statusEffect5 -->
    <div class="input-group">
      <select id="statusEffect1">
        <option value="none">None</option>
        <option value="mutilate">Mutilate</option>
        <option value="burn">Burn</option>
        <option value="bleed">Bleed</option>
         <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffect1Multiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>
    <div class="input-group">
      <select id="statusEffect2">
        <option value="none">None</option>
        <option value="mutilate">Mutilate</option>
        <option value="burn">Burn</option>
        <option value="bleed">Bleed</option>
         <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffect2Multiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>
    <div class="input-group">
      <select id="statusEffect3">
        <option value="none">None</option>
        <option value="mutilate">Mutilate</option>
        <option value="burn">Burn</option>
        <option value="bleed">Bleed</option>
         <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffect3Multiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>
    <div class="input-group">
      <select id="statusEffect4">
        <option value="none">None</option>
        <option value="mutilate">Mutilate</option>
        <option value="burn">Burn</option>
        <option value="bleed">Bleed</option>
         <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffect4Multiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>
    <div class="input-group">
      <select id="statusEffect5">
        <option value="none">None</option>
        <option value="mutilate">Mutilate</option>
        <option value="burn">Burn</option>
        <option value="bleed">Bleed</option>
         <option value="hemorrhage">Hemorrhage</option>
        <option value="burn">Burn</option>
        <option value="mutilate">Mutilate</option>
        <option value="blackflames">Blackflames</option>
        <option value="blizzard">Blizzard</option>
        <option value="sunburn">Sunburn</option>
        <option value="blueflame">Blueflame</option>
        <option value="plasma">Plasma</option>
        <option value="dismantle">Dismantle</option>
        <option value="blaze">Blaze</option>
        <option value="detonation">Detonation</option>
        <option value="electrify">Electrify</option>
        <option value="hex">Hex</option>
        <option value="poison">Poison</option>
        <option value="yoriichiSolarFlame">Yoriichi Solar Flame</option>
        <option value="rupture">Rupture</option>
      </select>
      <input type="number" id="statusEffect5Multiplier" placeholder="Custom Multiplier" step="0.1"/>
    </div>

    <label>
      <input type="checkbox" id="resetOnHit"> DOT Resets On Hit
    </label>

    <div class="input-group">
      <input type="number" id="passiveMultiplier" placeholder="Passive Multiplier (e.g. 5)" />
      <input type="number" id="passiveDuration" placeholder="Passive Duration (seconds)" />
    </div>
    <button onclick="calculateDPS()">Calculate DPS</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
const dotConfigs = {
  bolt: { spaReq: 5, multi: 1.2, resetsOnHit: true },
  bleed: { spaReq: 6, multi: 1.4 },
  hemorrhage: { spaReq: 3, multi: 1.4 },
  burn: { spaReq: 8, multi: 1.2 },
  mutilate: { spaReq: 8, multi: 3.0 },
  blackflames: { spaReq: 10, multi: 4.8 },
  blizzard: { spaReq: 9, multi: 1.9 },
  sunburn: { spaReq: 7, multi: 1.75 },
  blueflame: { spaReq: 5, multi: 1.3 },
  plasma: { spaReq: 7, multi: 1.55 },
  dismantle: { spaReq: 6, multi: 2.3 },
  blaze: { spaReq: 7, multi: 2.25 },
  hex: { spaReq: 6, multi: 0.5 },
  electrify: { spaReq: 3, multi: 0.3 },
  poison: { spaReq: 6, multi: 2.3 },
  detonation: { spaReq: 7, multi: 2.5 },
  yoriichiSolarFlame: { spaReq: 9, multi: 3.5, resetsOnHit: true },
  rupture: {spaReq: 14, multi: 5.4}
};

function formatLargeNumber(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(2) + '&nbsp;Trillion';
  if (num >= 1e9) return (num / 1e9).toFixed(2) + '&nbsp;Billion';
  if (num >= 1e6) return (num / 1e6).toFixed(2) + '&nbsp;Million';
  return num.toFixed(2);
}

function calculateDPS() {
  const damage = parseFloat(document.getElementById('damage').value);
  const unitMultiplier = parseFloat(document.getElementById('damageUnit').value);
  const spa = parseFloat(document.getElementById('spa').value);
  const critDmg = parseFloat(document.getElementById('critDmg').value) || 0;
  let critChance = parseFloat(document.getElementById('critChance').value) || 0;
  critChance = Math.min(critChance, 100);

  const statusSlots = [
    { key: document.getElementById('statusEffect').value, custom: parseFloat(document.getElementById('statusEffectMultiplier').value) },
    { key: document.getElementById('statusEffect1').value, custom: parseFloat(document.getElementById('statusEffect1Multiplier').value) },
    { key: document.getElementById('statusEffect2').value, custom: parseFloat(document.getElementById('statusEffect2Multiplier').value) },
    { key: document.getElementById('statusEffect3').value, custom: parseFloat(document.getElementById('statusEffect3Multiplier').value) },
    { key: document.getElementById('statusEffect4').value, custom: parseFloat(document.getElementById('statusEffect4Multiplier').value) },
    { key: document.getElementById('statusEffect5').value, custom: parseFloat(document.getElementById('statusEffect5Multiplier').value) },
  ];

  const resultDiv = document.getElementById('result');
  const resetOnHitChecked = document.getElementById('resetOnHit').checked;

  const passiveMultiplier = parseFloat(document.getElementById('passiveMultiplier').value) || 0;
  const passiveDuration = parseFloat(document.getElementById('passiveDuration').value) || 0;

  if (isNaN(damage) || isNaN(spa) || spa === 0 || isNaN(unitMultiplier)) {
    resultDiv.textContent = 'Please enter valid values';
    return;
  }

  const fullDamage = damage * unitMultiplier;
  const critChanceDecimal = critChance / 100;
  const critDmgDecimal = critDmg / 100;
  const averageHit = fullDamage * (1 + critChanceDecimal * critDmgDecimal);
  const hitDps = averageHit / spa;
  const baseDps = fullDamage / spa;

  function calculateDotDps(statusKey, customMultiplier) {
    if (statusKey === 'none' || !dotConfigs[statusKey]) return 0;
    const config = dotConfigs[statusKey];
    const multiplier = customMultiplier && !isNaN(customMultiplier) ? customMultiplier : config.multi;

    if (resetOnHitChecked) {
      const ticks = Math.min(Math.ceil(spa), config.spaReq);
      const damagePerTick = (fullDamage * multiplier) / config.spaReq;
      return (damagePerTick * ticks) / spa;
    } else {
      const dotInterval = Math.ceil(config.spaReq / spa) * spa;
      return (fullDamage * multiplier) / dotInterval;
    }
  }

  let totalDotDps = 0;
  statusSlots.forEach(slot => {
    totalDotDps += calculateDotDps(slot.key, slot.custom);
  });

  const averageNoCritDps = baseDps + totalDotDps;
  let totalDps = hitDps + totalDotDps;

  // Add passive DPS
  if (passiveMultiplier > 0 && passiveDuration > 0) {
    totalDps += (fullDamage * passiveMultiplier) / passiveDuration;
  }

  resultDiv.innerHTML = `
    Usual DPS (no crit): ${formatLargeNumber(averageNoCritDps)}<br>
    Total DPS (with crit): ${formatLargeNumber(totalDps)}
  `;
}

function toggleMode() {
  document.body.classList.toggle('light-mode');
}
</script>
</body>
</html>
