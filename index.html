<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPS Calculator</title>
<style>
/* Reset */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #121212; color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
body.light-mode { background-color: #f5f5f5; color: #121212; }
button { cursor: pointer; }
/* Container */
.container { width: 95%; max-width: 900px; padding: 20px; background-color: #1e1e1e; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: background 0.3s; }
body.light-mode .container { background-color: #ffffff; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.section input { display: block; width: 100%; margin-bottom: 10px; }
/* Toggle Button */
.toggle-mode { background-color: #ff6b6b; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; margin-bottom: 20px; transition: background 0.3s; }
body.light-mode .toggle-mode { background-color: #ff4d4d; color: #fff; }
.card h1 { text-align: center; margin-bottom: 20px; font-size: 2em; color: #ff6b6b; }
body.light-mode .card h1 { color: #ff4d4d; }
/* Sections */
.section { margin-bottom: 25px; }
.section h2 { font-size: 1.2em; margin-bottom: 10px; border-bottom: 2px solid #ff6b6b; display: inline-block; padding-bottom: 2px; }
body.light-mode .section h2 { border-bottom: 2px solid #ff4d4d; }
input, select { width: calc(50% - 10px); padding: 10px; margin: 5px 5px 5px 0; border-radius: 8px; border: none; font-size: 1em; background-color: #2c2c2c; color: #f0f0f0; transition: background 0.3s, color 0.3s; }
body.light-mode input, body.light-mode select { background-color: #f0f0f0; color: #121212; }
select { cursor: pointer; }
/* Base attack row */
.base-attack-row { display: flex; gap: 10px; margin-bottom: 10px; }
.base-attack-row input, .base-attack-row select { flex: 1; }
/* DOT Grid */
.dot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.dot-slot { display: flex; flex-direction: column; }
.dot-slot label { margin-bottom: 5px; font-weight: 600; }
.dot-slot input[type="checkbox"] { width: auto; margin-top: 5px; }
/* Buttons */
.button-container { text-align: center; margin-top: 20px; }
.button-container button { background-color: #1e90ff; border: none; padding: 12px 30px; border-radius: 12px; font-weight: bold; font-size: 1em; color: #fff; transition: background 0.3s; }
.button-container button:hover { background-color: #0f75d1; }
body.light-mode .button-container button { background-color: #007bff; color: #fff; }
body.light-mode .button-container button:hover { background-color: #005fcc; }
/* Result */
.result { margin-top: 20px; padding: 15px; border-radius: 12px; background-color: #2c2c2c; font-weight: bold; text-align: center; }
body.light-mode .result { background-color: #e0e0e0; color: #121212; }
/* Responsive */
@media (max-width: 600px) { input, select { width: 100%; } .base-attack-row { flex-direction: column; } }
</style>
</head>
<body>

<div class="container">
  <button class="toggle-mode" onclick="toggleMode()">Toggle Mode</button>

  <div class="card">
    <h1>DPS Calculator</h1>

    <div class="section">
      <h2>Base Attack</h2>
      <div class="base-attack-row">
        <input type="number" id="damage" placeholder="Enter Damage" />
        <select id="damageUnit">
          <option value="1">-</option>
          <option value="1000000">Million</option>
          <option value="1000000000">Billion</option>
          <option value="1000000000000">Trillion</option>
        </select>
      </div>
      <input type="number" id="spa" placeholder="Enter SPA (Seconds Per Attack)" />
      <input type="number" id="critDmg" placeholder="Crit Damage % (e.g. 50)" />
      <input type="number" id="critChance" placeholder="Crit Chance % (e.g. 30)" />
    </div>

    <div class="section">
      <h2>DOTs</h2>
      <div class="dot-grid">
        <div class="dot-slot">
          <label>DOT 1</label>
          <select id="statusEffect"></select>
          <input type="number" id="statusEffectMultiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffectReset"> Resets On Hit</label>
        </div>
        <div class="dot-slot">
          <label>DOT 2</label>
          <select id="statusEffect1"></select>
          <input type="number" id="statusEffect1Multiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffect1Reset"> Resets On Hit</label>
        </div>
        <div class="dot-slot">
          <label>DOT 3</label>
          <select id="statusEffect2"></select>
          <input type="number" id="statusEffect2Multiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffect2Reset"> Resets On Hit</label>
        </div>
        <div class="dot-slot">
          <label>DOT 4</label>
          <select id="statusEffect3"></select>
          <input type="number" id="statusEffect3Multiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffect3Reset"> Resets On Hit</label>
        </div>
        <div class="dot-slot">
          <label>DOT 5</label>
          <select id="statusEffect4"></select>
          <input type="number" id="statusEffect4Multiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffect4Reset"> Resets On Hit</label>
        </div>
        <div class="dot-slot">
          <label>DOT 6</label>
          <select id="statusEffect5"></select>
          <input type="number" id="statusEffect5Multiplier" placeholder="Custom Multiplier" step="0.1"/>
          <label><input type="checkbox" id="statusEffect5Reset"> Resets On Hit</label>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Passive</h2>
      <input type="number" id="passiveMultiplier" placeholder="Passive Multiplier (e.g. 5)" />
      <input type="number" id="passiveDuration" placeholder="Passive Duration (seconds)" />
    </div>

    <div class="button-container">
      <button onclick="calculateDPS()">Calculate DPS</button>
    </div>

    <div class="result" id="result"></div>
  </div>
</div>

<script>
const dotConfigs = {
  bolt: { spaReq: 5, multi: 1.2 },
  bleed: { spaReq: 6, multi: 1.4 },
  hemorrhage: { spaReq: 3, multi: 1.4 },
  burn: { spaReq: 8, multi: 1.2 },
  mutilate: { spaReq: 8, multi: 3.0 },
  blackflames: { spaReq: 10, multi: 4.8 },
  blizzard: { spaReq: 9, multi: 1.9 },
  sunburn: { spaReq: 7, multi: 1.75 },
  blueflame: { spaReq: 5, multi: 1.3 },
  plasma: { spaReq: 7, multi: 1.55 },
  dismantle: { spaReq: 6, multi: 2.3 },
  blaze: { spaReq: 7, multi: 2.25 },
  hex: { spaReq: 6, multi: 0.5 },
  electrify: { spaReq: 3, multi: 1.2 },
  poison: { spaReq: 6, multi: 2.3 },
  detonation: { spaReq: 7, multi: 2.5 },
  yoriichiSolarFlame: { spaReq: 9, multi: 3.5 },
  rupture: {spaReq: 14, multi: 5.4}
};

const dotSelects = ['statusEffect','statusEffect1','statusEffect2','statusEffect3','statusEffect4','statusEffect5'];

// Populate DOT dropdowns
dotSelects.forEach(id => {
  const select = document.getElementById(id);

  // Add "None" option
  const noneOpt = document.createElement('option');
  noneOpt.value = 'none';
  noneOpt.textContent = 'None';
  select.appendChild(noneOpt);

  for (const key in dotConfigs) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = key.charAt(0).toUpperCase() + key.slice(1);
    select.appendChild(opt);
  }
  select.value = 'none'; // set default selection
});

function formatLargeNumber(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(2) + ' Trillion';
  if (num >= 1e9) return (num / 1e9).toFixed(2) + ' Billion';
  if (num >= 1e6) return (num / 1e6).toFixed(2) + ' Million';
  return num.toFixed(2);
}

function calculateDPS() {
  const damage = parseFloat(document.getElementById('damage').value);
  const unitMultiplier = parseFloat(document.getElementById('damageUnit').value);
  const spa = parseFloat(document.getElementById('spa').value);
  const critDmg = parseFloat(document.getElementById('critDmg').value) || 0;
  let critChance = parseFloat(document.getElementById('critChance').value) || 0;
  critChance = Math.min(critChance, 100);

  const passiveMultiplier = parseFloat(document.getElementById('passiveMultiplier').value) || 0;
  const passiveDuration = parseFloat(document.getElementById('passiveDuration').value) || 0;

  const resultDiv = document.getElementById('result');

  if (isNaN(damage) || isNaN(spa) || spa <= 0 || isNaN(unitMultiplier)) {
    resultDiv.textContent = 'Please enter valid values';
    return;
  }

  const fullDamage = damage * unitMultiplier;
  const critChanceDecimal = critChance / 100;
  const critDmgDecimal = critDmg / 100;

  // Base attack DPS
  const averageHit = fullDamage * (1 + critChanceDecimal * critDmgDecimal);
  const hitDps = averageHit / spa;
  const baseDps = fullDamage / spa;

  // DoT DPS
  const statusSlots = dotSelects.map((id, i) => {
    const multiplierInputId = i === 0 ? 'statusEffectMultiplier' : `statusEffect${i}Multiplier`;
    const resetInputId = i === 0 ? 'statusEffectReset' : `statusEffect${i}Reset`;
    const customValue = parseFloat(document.getElementById(multiplierInputId).value);
    const resetChecked = document.getElementById(resetInputId).checked;
    return { key: document.getElementById(id).value, custom: isNaN(customValue) ? null : customValue, reset: resetChecked };
  });

  let totalDotDps = 0;

  statusSlots.forEach(slot => {
    if (slot.key === 'none' || !dotConfigs[slot.key]) return;
    const cfg = dotConfigs[slot.key];
    const multiplier = slot.custom || cfg.multi;
    const totalDotDamage = fullDamage * multiplier;

    if (slot.reset) {
      // Reset-on-hit DPS uses SPA as the loop duration
      totalDotDps += totalDotDamage / spa;
    } else {
      // Normal DPS spread over DoT duration
      totalDotDps += totalDotDamage / cfg.spaReq;
    }
  });

  // Passive DPS
  let passiveDps = 0;
  if (passiveMultiplier > 0 && passiveDuration > 0) {
    passiveDps = (fullDamage * passiveMultiplier) / passiveDuration;
  }

  const averageNoCritDps = baseDps + totalDotDps + passiveDps;
  const totalDps = hitDps + totalDotDps + passiveDps;

  resultDiv.innerHTML = `
    Usual DPS (no crit): ${formatLargeNumber(averageNoCritDps)}<br>
    Total DPS (with crit): ${formatLargeNumber(totalDps)}
  `;
}

function toggleMode() {
  document.body.classList.toggle('light-mode');
}
</script>
</body>
</html>
